# Frisquet Visio (Eco Radio) → Home Assistant, sur une Heltec WiFi LoRa 32 V4.3.
# La carte devient le « Frisquet Connect » de la chaudière. Voir README.md pour l'installation pas à pas.
#
# À faire avant le premier flash : copier secrets.yaml.example en secrets.yaml et le remplir.
# Rien d'autre à configurer : le réseau radio et les identifiants sont appris à l'association.

substitutions:
  name: frisquet
  friendly_name: Frisquet
  # Consommation estimée (plaque signalétique de la chaudière) : puissance nominale en kW, et charge moyenne du brûleur
  # (une chaudière à condensation module entre ~25 et 100 %). Ajuster la charge en comparant avec le compteur de gaz.
  burner_power_kw: "25"
  burner_average_load: "0.6"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: openfrisquetvisio.esphome
    version: "1.0.0"
  on_boot:
    # Écran OLED de la Heltec V4 : allumer son alimentation (Vext, GPIO36 active à l'état bas) avant le bus I2C.
    - priority: 1100
      then:
        - lambda: |-
            pinMode(36, OUTPUT);
            digitalWrite(36, LOW);
            delay(50);
    # Restore the selected vacation window into the radio component before Home Assistant can trigger an action.
    # The datetime entities themselves restore their values from flash.
    - priority: -100
      then:
        - lambda: |-
            if (id(holiday_start).year > 0)
              id(frisquet_component).set_holiday_start(id(holiday_start).year, id(holiday_start).month, id(holiday_start).day,
                                                   id(holiday_start).hour, id(holiday_start).minute, id(holiday_start).second);
            if (id(holiday_end).year > 0)
              id(frisquet_component).set_holiday_end(id(holiday_end).year, id(holiday_end).month, id(holiday_end).day,
                                                 id(holiday_end).hour, id(holiday_end).minute, id(holiday_end).second);

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: arduino
    # Si le journal de démarrage affiche « Set flash_chip: boya under esp32 > framework > advanced », ajouter :
    # advanced:
    #   flash_chip: boya

external_components:
  # Le composant est téléchargé depuis GitHub (mis en cache un jour). Pour développer sur une copie locale :
  #   - source:
  #       type: local
  #       path: components
  #     components: [frisquet]
  - source: github://DocEmmetBrown/openfrisquetvision-esphome
    components: [frisquet]

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} secours"

captive_portal:

api:
  # La carte est le Connect de la chaudière : elle doit continuer à tourner même sans Home Assistant.
  reboot_timeout: 0s
  encryption:
    key: !secret api_key

ota:
  # Mises à jour sans fil chiffrées avec la clé de l'API.
  - platform: esphome
    encryption: {}

frisquet:
  id: frisquet_component
  board: heltec_v4_3
  # Émission complète : lectures, accusés et écritures (consignes, modes, programme, eau chaude).
  tx: write
  dry_run: false
  # Le bouton « Associer le Connect » peut répondre à la chaudière (indispensable à la première mise en service).
  pairing: true
  # Réponse d'association d'un vrai Frisquet Connect (version 21.01.02).
  pairing_version: "01:21:01:02"
  # Un changement de la zone 1 agit sur la chaudière en moins d'une minute, sans attendre le satellite.
  satellite_override: true
  rx_boosted_gain: true

  # Zone 1
  zone1_ambient_temperature:
    id: z1_ambient
    name: Zone 1 température ambiante
  zone1_setpoint:
    id: z1_setpoint
    name: Zone 1 consigne
  zone1_mode:
    id: z1_mode
    name: Zone 1 mode
  zone_program:
    name: Zone 1 programme (lisible)
  zone1_flow_temperature:
    name: Zone 1 départ
  zone1_flow_setpoint:
    name: Zone 1 consigne de départ

  # Chaudière
  boiler_state:
    id: boiler_state
    name: Chaudière état
  burner:
    id: burner
    name: Chaudière brûleur
  boiler_fault:
    name: Chaudière anomalie
  last_alert:
    id: last_alert
    name: Chaudière dernière alerte
  outdoor_temperature:
    name: Température extérieure
  hot_water_temperature:
    id: hot_water
    name: Chaudière eau chaude
  heating_body_temperature:
    name: Chaudière corps de chauffe
  heating_body_live:
    name: Chaudière corps de chauffe (direct)
  flue_temperature:
    name: Chaudière fumées
  pressure:
    name: Chaudière pression
  hot_water_mode:
    name: Chaudière mode ECS (lu)
  holiday_state:
    name: Chaudière vacances (état)
  holiday_write:
    name: Chaudière vacances (écriture)
    entity_category: diagnostic
  boiler_clock:
    name: Chaudière horloge
    entity_category: diagnostic

  # Consommations comptées par la chaudière (kWh, comme le Frisquet Connect). Certaines chaudières ne les comptent pas
  # (toujours 0, panneau V19.01 par exemple) : désactivées par défaut, voir plus bas la consommation estimée.
  consumption_hot_water:
    name: Consommation eau chaude (jour)
    disabled_by_default: true
  consumption_heating:
    name: Consommation chauffage (jour)
    disabled_by_default: true
  annual_consumption_hot_water:
    name: Consommation eau chaude (année)
    disabled_by_default: true
  annual_consumption_heating:
    name: Consommation chauffage (année)
    disabled_by_default: true

  # Diagnostic
  panel_version:
    name: Chaudière version panneau
  paired_versions:
    name: Chaudière appareils appairés
  zone1_flow_min:
    name: Zone 1 départ mini
  zone1_flow_max:
    name: Zone 1 départ maxi
  network:
    name: Radio réseau
  pairing_state:
    name: Radio association
  zone_block_state:
    name: Zone 1 bloc
  zone_write:
    name: Zone 1 écriture
  hot_water_write:
    name: Chaudière écriture ECS
  rssi:
    name: Radio signal
    filters:
      - throttle: 60s
  seconds_since_frame:
    name: Radio âge dernière trame
  reads_failed:
    name: Radio lectures échouées

climate:
  - platform: frisquet
    name: Zone 1

datetime:
  - platform: template
    id: holiday_start
    type: datetime
    name: Chaudière vacances début
    optimistic: true
    restore_value: true
    set_action:
      then:
        - lambda: |-
            id(frisquet_component).set_holiday_start(x.year, x.month, x.day_of_month, x.hour, x.minute, x.second);
  - platform: template
    id: holiday_end
    type: datetime
    name: Chaudière vacances fin
    optimistic: true
    restore_value: true
    set_action:
      then:
        - lambda: |-
            id(frisquet_component).set_holiday_end(x.year, x.month, x.day_of_month, x.hour, x.minute, x.second);

select:
  - platform: frisquet
    type: zone1_mode
    name: Zone 1 mode (commande)
  - platform: frisquet
    name: Chaudière mode ECS

number:
  - platform: frisquet
    type: zone1_comfort
    name: Zone 1 consigne confort
  - platform: frisquet
    type: zone1_reduced
    name: Zone 1 consigne réduit
  - platform: frisquet
    type: zone1_frost
    name: Zone 1 consigne hors-gel

text:
  - platform: frisquet
    name: Zone 1 programme
    mode: text

switch:
  - platform: frisquet
    type: zone1_boost
    name: Zone 1 boost
  - platform: frisquet
    name: Radio arrêt d'urgence
    restore_mode: ALWAYS_OFF
    entity_category: config
  - platform: gpio
    id: vext
    pin: GPIO36
    inverted: true
    restore_mode: ALWAYS_ON
    internal: true

button:
  - platform: frisquet
    type: associate
    name: Radio associer le Connect
    entity_category: config
  - platform: frisquet
    type: recover_network
    name: Radio récupérer le réseau
    entity_category: config
  - platform: frisquet
    type: forget_network
    name: Radio oublier le réseau appris
    entity_category: config
  - platform: frisquet
    type: holiday_activate
    name: Chaudière activer les vacances
  - platform: frisquet
    type: holiday_cancel
    name: Chaudière annuler les vacances
  - platform: restart
    name: Redémarrer
    entity_category: config

sensor:
  # Consommation estimée à partir du temps de flamme : brûleur allumé avec demande de chauffage = chauffage, sans demande
  # = eau chaude. Pour le tableau Énergie de Home Assistant.
  - platform: template
    id: power_heating
    name: Chaudière puissance chauffage (estimée)
    unit_of_measurement: kW
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      const bool heating = id(boiler_state).has_state() && id(boiler_state).state == "En marche";
      return id(burner).has_state() && id(burner).state && heating ? ${burner_power_kw} * ${burner_average_load} : 0.0f;
  - platform: template
    id: power_hot_water
    name: Chaudière puissance eau chaude (estimée)
    unit_of_measurement: kW
    device_class: power
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      const bool heating = id(boiler_state).has_state() && id(boiler_state).state == "En marche";
      return id(burner).has_state() && id(burner).state && !heating ? ${burner_power_kw} * ${burner_average_load} : 0.0f;
  - platform: integration
    name: Consommation chauffage (estimée)
    sensor: power_heating
    time_unit: h
    integration_method: left
    restore: true
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 2
  - platform: integration
    name: Consommation eau chaude (estimée)
    sensor: power_hot_water
    time_unit: h
    integration_method: left
    restore: true
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 2
  - platform: uptime
    name: Uptime
    entity_category: diagnostic
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
    entity_category: diagnostic

# Écran OLED intégré (SSD1306 128×64). Sans écran, supprimer i2c:, font: et display: (et le on_boot plus haut).
i2c:
  id: oled_bus
  sda: GPIO17
  scl: GPIO18
  frequency: 400kHz

font:
  - file: "gfonts://Roboto"
    id: font_big
    size: 18
    glyphs: " 0123456789.,:-°C/>"
  - file: "gfonts://Roboto"
    id: font_small
    size: 11
    glyphs: " !\"'()+,-./0123456789:;<>?ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°éèêàçôûÉ"

display:
  - platform: ssd1306_i2c
    i2c_id: oled_bus
    model: "SSD1306 128x64"
    address: 0x3C
    reset_pin: GPIO21
    contrast: 50%
    update_interval: 5s
    lambda: |-
      if (id(z1_ambient).has_state() && id(z1_setpoint).has_state())
        it.printf(0, 0, id(font_big), "%.1f° > %.1f°", id(z1_ambient).state, id(z1_setpoint).state);
      else
        it.print(0, 0, id(font_big), "--.-° > --.-°");
      it.printf(0, 22, id(font_small), "Zone 1 : %s", id(z1_mode).has_state() ? id(z1_mode).state.c_str() : "?");
      std::string state = id(boiler_state).has_state() ? id(boiler_state).state : "?";
      if (id(burner).has_state() && id(burner).state) state += " (flamme)";
      if (id(hot_water).has_state())
        it.printf(0, 36, id(font_small), "%s  ECS %.0f°", state.c_str(), id(hot_water).state);
      else
        it.printf(0, 36, id(font_small), "%s", state.c_str());
      it.printf(0, 50, id(font_small), "%s", id(last_alert).has_state() ? id(last_alert).state.c_str() : "");
