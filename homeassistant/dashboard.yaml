# Tableau de bord Home Assistant pour la chaudière Frisquet (frisquet.yaml).
# Paramètres > Tableaux de bord > ajouter un tableau de bord > « Modifier » > ⋮ > « Éditeur de configuration brute »,
# puis coller ce contenu.
#
# Les identifiants sont ceux d'un appareil nommé « Frisquet » (climate.frisquet_zone_1…). Si les vôtres diffèrent
# (autre nom, pièce dans le nom), générez la version adaptée : python3 homeassistant/dashboard.py cuisine_frisquette
# Installer aussi la ressource frisquet-program-card.js : voir README.md, section Home Assistant.
# Les profils et l'onglet Plannings nécessitent les helpers HA et l'action ESPHome décrits dans docs/PROGRAM-PROFILES.md.
title: Chauffage
views:
  - title: Chauffage
    path: chauffage
    icon: mdi:radiator
    cards:
      - type: thermostat
        entity: climate.frisquet_zone_1
        features:
          - type: climate-hvac-modes
            hvac_modes: [auto, heat, "off"]
          - type: climate-preset-modes
            style: icons
            preset_modes: [comfort, eco, boost]

      - type: entities
        title: Zone 1
        entities:
          - entity: sensor.frisquet_zone_1_temperature_ambiante
            name: Ambiante
          - entity: sensor.frisquet_zone_1_consigne
            name: Consigne active
          - entity: select.frisquet_zone_1_mode_commande
            name: Mode
          - entity: switch.frisquet_zone_1_boost
            name: Boost (+1 °C, 6 h max)

      - type: custom:frisquet-program-card
        entity: text.frisquet_zone_1_programme
        write_entity: sensor.frisquet_zone_1_ecriture
        comfort_entity: number.frisquet_zone_1_consigne_confort
        reduced_entity: number.frisquet_zone_1_consigne_reduit
        frost_entity: number.frisquet_zone_1_consigne_hors_gel
        profile_action: esphome.frisquet_apply_heating_profile
        profiles:
          - input_text.frisquet_planning_1
          - input_text.frisquet_planning_2
          - input_text.frisquet_planning_3
          - input_text.frisquet_planning_4

      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              ## Températures de consigne
              Ajustez avec **− / +** (0,5 °C), ou cliquez sur une tuile pour saisir une température.
          - type: tile
            entity: number.frisquet_zone_1_consigne_confort
            name: Confort
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: number.frisquet_zone_1_consigne_reduit
            name: Réduit
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
            features:
              - type: numeric-input
                style: buttons
          - type: tile
            entity: number.frisquet_zone_1_consigne_hors_gel
            name: Hors-gel
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
            features:
              - type: numeric-input
                style: buttons

      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              ## Vacances
              Choisissez les dates et heures locales de début et de fin, puis **Programmer**.
              Une absence de quelques heures est possible. Modifier les dates ne suffit pas à les appliquer.

              **Expérimental :** le comportement sur chaudière réelle reste à valider.
          - type: entities
            show_header_toggle: false
            entities:
              - entity: datetime.frisquet_chaudiere_vacances_debut
                name: Début de l'absence
              - entity: datetime.frisquet_chaudiere_vacances_fin
                name: Fin de l'absence
              - entity: sensor.frisquet_chaudiere_vacances_etat
                name: Période confirmée par la chaudière
              - entity: sensor.frisquet_chaudiere_vacances_ecriture
                name: État de la commande
          - type: horizontal-stack
            cards:
              - type: button
                entity: button.frisquet_chaudiere_activer_les_vacances
                name: Programmer
                icon: mdi:calendar-check
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.frisquet_chaudiere_activer_les_vacances
                  confirmation:
                    text: Programmer les vacances avec les dates et heures choisies ?
              - type: button
                entity: button.frisquet_chaudiere_annuler_les_vacances
                name: Annuler les vacances
                icon: mdi:calendar-remove
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.frisquet_chaudiere_annuler_les_vacances
                  confirmation:
                    text: Effacer la période de vacances de la chaudière ?

      - type: entities
        title: Chaudière
        entities:
          - entity: sensor.frisquet_chaudiere_etat
            name: État
          - entity: binary_sensor.frisquet_chaudiere_bruleur
            name: Brûleur
          - entity: select.frisquet_chaudiere_mode_ecs
            name: Eau chaude
          - entity: sensor.frisquet_chaudiere_eau_chaude
            name: Température eau chaude
          - entity: sensor.frisquet_temperature_exterieure
            name: Extérieur
          - entity: sensor.frisquet_zone_1_depart
            name: Départ
          - entity: sensor.frisquet_chaudiere_pression
            name: Pression
          - entity: binary_sensor.frisquet_chaudiere_anomalie
            name: Anomalie
          - entity: sensor.frisquet_chaudiere_derniere_alerte
            name: Dernière alerte

      - type: history-graph
        title: Températures (24 h)
        hours_to_show: 24
        entities:
          - entity: sensor.frisquet_zone_1_temperature_ambiante
            name: Ambiante
          - entity: sensor.frisquet_zone_1_consigne
            name: Consigne
          - entity: sensor.frisquet_temperature_exterieure
            name: Extérieur
          - entity: binary_sensor.frisquet_chaudiere_bruleur
            name: Brûleur

      - type: statistics-graph
        title: Consommation (kWh par jour)
        chart_type: bar
        period: day
        stat_types: [change]
        entities:
          - entity: sensor.frisquet_consommation_chauffage_estimee
            name: Chauffage (estimé)
          - entity: sensor.frisquet_consommation_eau_chaude_estimee
            name: Eau chaude (estimé)

      - type: entities
        title: Radio et association
        state_color: true
        entities:
          - entity: sensor.frisquet_radio_reseau
            name: Réseau
          - entity: sensor.frisquet_radio_association
            name: Dernière association
          - entity: sensor.frisquet_zone_1_bloc
            name: Bloc de zone (doit être « confirmé »)
          - entity: sensor.frisquet_zone_1_ecriture
            name: Dernière écriture de zone
          - entity: button.frisquet_radio_associer_le_connect
            name: Associer le Connect
          - entity: sensor.frisquet_radio_signal
            name: Signal
          - entity: sensor.frisquet_radio_age_derniere_trame
            name: Dernière trame
          - entity: switch.frisquet_radio_arret_d_urgence
            name: Arrêt d'urgence (n'émet plus rien)

  - title: Plannings
    path: plannings
    icon: mdi:calendar-edit
    cards:
      - type: custom:frisquet-program-card
        entity: text.frisquet_zone_1_programme
        write_entity: sensor.frisquet_zone_1_ecriture
        comfort_entity: number.frisquet_zone_1_consigne_confort
        reduced_entity: number.frisquet_zone_1_consigne_reduit
        frost_entity: number.frisquet_zone_1_consigne_hors_gel
        profile_action: esphome.frisquet_apply_heating_profile
        profile_management: true
        profiles:
          - input_text.frisquet_planning_1
          - input_text.frisquet_planning_2
          - input_text.frisquet_planning_3
          - input_text.frisquet_planning_4
