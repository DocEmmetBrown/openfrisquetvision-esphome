# Paste as a new automation in HA's YAML editor.
# Replace the ESPHome action name with the one offered by your device in Developer tools > Actions.
alias: Frisquet - transmettre la température extérieure
description: Transmet la mesure et son âge réel, même si sa valeur ne change pas.
triggers:
  - trigger: time_pattern
    minutes: "/1"
  - trigger: state
    entity_id: sensor.timmerflotte_temp_hmd_sensor_temperature_5
conditions:
  - condition: template
    value_template: >-
      {% set source = states.sensor.timmerflotte_temp_hmd_sensor_temperature_5 %}
      {{ source is defined and is_number(source.state)
         and source.attributes.get('unit_of_measurement') == '°C'
         and -40 <= source.state | float <= 60
         and 0 <= as_timestamp(now()) - as_timestamp(source.last_reported) < 10800 }}
actions:
  - action: esphome.frisquet_outdoor_temperature
    data:
      temperature: "{{ states('sensor.timmerflotte_temp_hmd_sensor_temperature_5') | float }}"
      sample_age_seconds: >-
        {{ (as_timestamp(now()) -
            as_timestamp(states.sensor.timmerflotte_temp_hmd_sensor_temperature_5.last_reported)) | int }}
mode: single
