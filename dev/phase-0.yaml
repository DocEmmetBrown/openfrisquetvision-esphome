# Phase 0 : spike passif. Réception seule, aucune émission radio (tx: none).
# WiFi fourni par l'environnement : OFV_WIFI_SSID / OFV_WIFI_PASSWORD.
esphome:
  name: frisquette
  friendly_name: Frisquette
  project:
    name: openfrisquetvisio.esphome
    version: "0.1.0-phase-0"
  platformio_options:
    board_build.flash_mode: qio
    board_build.f_flash: 80000000L
    board_build.f_cpu: 240000000L

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: ../components
    components: [frisquet]

logger:
  level: DEBUG

wifi:
  ssid: !env_var OFV_WIFI_SSID
  password: !env_var OFV_WIFI_PASSWORD
  reboot_timeout: 5min

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

debug:
  update_interval: 30s

frisquet:
  board: heltec_v4_3
  network_id: "05:D9:8D:C9"
  tx: none
  rx_bandwidth: 234.3
  lna_bypass: false
  zone1_ambient_temperature:
    name: Zone 1 température ambiante
  zone1_setpoint:
    name: Zone 1 consigne
  zone1_mode:
    name: Zone 1 mode
  boiler_state:
    name: Chaudière état
  boiler_clock:
    name: Chaudière horloge
  rssi:
    name: Radio RSSI
    filters:
      - throttle: 60s
  frames_valid:
    name: Radio trames valides
    filters:
      - throttle: 60s
  frames_repaired:
    name: Radio trames réparées
    filters:
      - throttle: 60s
  frames_rejected:
    name: Radio trames rejetées
    filters:
      - throttle: 60s

sensor:
  - platform: uptime
    name: Uptime
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
  - platform: debug
    free:
      name: Heap libre
    block:
      name: Heap bloc max
    loop_time:
      name: Durée de boucle
    cpu_frequency:
      name: Fréquence CPU

text_sensor:
  - platform: version
    name: ESPHome version
